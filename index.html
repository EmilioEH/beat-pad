<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0f0f1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Beat Pad — tap, sequence, loop">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>Beat Pad</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header id="transport">
      <button id="playBtn" class="tr-btn" aria-label="Play/Stop">▶</button>
      <div id="bpmWrap">
        <input type="range" id="bpmSlider" min="60" max="200" value="120" step="1">
        <span id="bpmDisplay">120</span>
      </div>
      <button id="recBtn" class="tr-btn" aria-label="Record">●</button>
      <button id="clrBtn" class="tr-btn" aria-label="Clear pattern">⌂</button>
    </header>

    <main id="padGrid"></main>

    <section id="seqSection">
      <div id="seqHeader">
        <button id="prevPad" class="sm-btn">‹</button>
        <span id="padLabel">Kick</span>
        <button id="nextPad" class="sm-btn">›</button>
        <select id="kitSelect">
          <option value="808">808</option>
          <option value="acoustic">Acoustic</option>
        </select>
      </div>
      <div id="stepRow"></div>
      <div id="seqOpts">
        <label class="toggle"><input type="checkbox" id="quantToggle" checked> Quantize</label>
      </div>
    </section>

    <div id="helpBar">Tap pads · Select pad to edit steps · ● to record</div>
  </div>

  <script src="js/audio-engine.js"></script>
  <script src="js/sequencer.js"></script>
  <script src="js/recorder.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
